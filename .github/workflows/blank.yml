name: Build Sammy Football APK

on:
push:
branches: [main]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extract Android project
    run: |
      unzip -q sammy_football_2027_android_project.zip -d extracted
      find extracted -name gradlew -type f

  - name: Build APK
    run: |
      cd extracted/sammy_football_android_app
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Sammy-Football-2027-APK
      path: extracted/sammy_football_android_app/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
